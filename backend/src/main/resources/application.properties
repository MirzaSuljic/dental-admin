spring.application.name=dental-admin
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}

# Baza (Neon)
spring.datasource.url=jdbc:postgresql://ep-summer-shadow-b9bhm1ah.c-7.eu-central-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
spring.datasource.username=neondb_owner
spring.datasource.password=${DB_PASSWORD}

# Tabele se prave i mijenjaju same na osnovu Java klasa
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Prijava
app.jwt.secret=${JWT_SECRET}
app.jwt.expires-in=8h

# Prvi administrator (pravi se pri prvom pokretanju)
app.admin.email=admin@ordinacija.ba
app.admin.password=${ADMIN_PASSWORD:Admin12345}

# Adresa frontenda (za CORS)
app.client-url=${CLIENT_URL:http://localhost:5173}


